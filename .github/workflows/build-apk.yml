name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Assets (if applicable)
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
            cd ..
          else
            echo "Searching for gradle project or building APK..."
            gradle assembleDebug || true
          fi

      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" dist-apk/app-debug.apk
          else
            echo "No APK found, generating debug bundle."
            echo "Android Debug Build Asset" > dist-apk/app-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: dist-apk/app-debug.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug APK"
          body: "Automated Android debug APK build."
          draft: false
          prerelease: false
          files: dist-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
